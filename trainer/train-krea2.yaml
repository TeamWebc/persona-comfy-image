# ai-toolkit config for a Krea 2 persona LoRA.
#
# A TEMPLATE. `handler.py` fills in the per-run fields before each training:
# `training_folder`, `trigger_word`, `network.linear`, `network.linear_alpha`,
# `train.steps`, `datasets[0].folder_path`, and the three `model.*` paths, which
# point at the shared network volume.
#
# Everything left here is a deliberate default, and the ones that matter:
#
#   caption_ext / captions   There are none. The dataset is forty frames drawn
#                            from her frozen identity sheet by prompts we wrote,
#                            so the trigger word alone is the caption. An
#                            autocaptioner re-describing a face it was never
#                            told about is how a training set acquires opinions
#                            about her — the same reason `autocaption: false` is
#                            hardcoded on the Replicate trainer row.
#
#   resolution               Multi-resolution buckets. A LoRA trained at one
#                            shape renders badly at others and the feed asks for
#                            several, so more than one bucket is wanted.
#
#                            1280 was in this list and is gone. The frames are
#                            1080 on the short edge, so that bucket trained on an
#                            upscale of what we paid to render — and it is where
#                            peak memory lives. A 3000-step run reached step 13,
#                            hit the 1280 bucket and died with "OOM during
#                            training step 3 times in a row" after the GPU had
#                            been paid for since the cold start. Nothing is lost
#                            by removing it and a 24GB card becomes viable.
#
#   network.linear = 16      Rank. Overridden per run. 16 is enough for one
#                            face; higher starts learning the backgrounds too.
---
job: extension
config:
  name: persona_lora
  process:
    - type: sd_trainer
      training_folder: /runpod-volume/training/PLACEHOLDER
      device: cuda:0
      trigger_word: PLACEHOLDER

      network:
        type: lora
        linear: 16
        linear_alpha: 16

      save:
        dtype: float16
        save_every: 500
        # Two: the run's own output, and one fallback. More is disk on a volume
        # that also holds the models both endpoints load from.
        max_step_saves_to_keep: 2

      datasets:
        - folder_path: /PLACEHOLDER
          caption_ext: txt
          caption_dropout_rate: 0.0
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [768, 1024]

      train:
        batch_size: 1
        steps: 1000
        gradient_accumulation_steps: 1
        train_unet: true
        # Krea 2's text encoder is a 4B VLM. Training it as well would triple
        # the memory for a face the transformer is perfectly able to learn.
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: 1e-4
        dtype: bf16

        # Off, and kept rather than deleted so the choice stays visible.
        #
        # EMA averages weights across steps to stabilise training. The
        # practitioner consensus for this model is that it costs more than it
        # buys — LoRAs trained with it came out worse than the same run without.
        # Flip to true to test that against our own dataset.
        ema_config:
          use_ema: false

      model:
        # All three filled in by handler.py from the network volume.
        name_or_path: PLACEHOLDER
        text_encoder_path: PLACEHOLDER
        vae_path: PLACEHOLDER
        arch: krea2
        # NO adapter_path, and no turbo checkpoint above it.
        #
        # ai-toolkit trains Krea 2 two ways: the raw model, or the turbo
        # distillation through `ostris/krea2_turbo_training_adapter`. We used the
        # adapter, and it cost the thing hardest to get back.
        #
        # Measured against a fal-trained LoRA of the same face at the same rank
        # and step count: fal touches 264 modules, the adapter path touches 256.
        # The eight missing ones are the edges — first, last_linear, tmlp_0,
        # tmlp_2, tproj_1, txtmlp_1, txtmlp_3, txtfusion_projector — and those are
        # where a latent becomes pixels. So the LoRA learned who she is and not
        # how she is photographed: right face, flat platinum hair, smooth skin, no
        # freckles. The operator saw it instantly; the similarity score, which
        # rewards closeness to the reference frames, ranked it fine.
        #
        # `_write_config` overwrites keys and never deletes them, so this stays
        # absent here rather than being popped in the handler.
        quantize: true

      sample:
        # Off. The app renders its own eight evaluation samples afterwards and
        # scores them against her identity sheet — sampling here would cost GPU
        # minutes to produce images nothing reads.
        sample_every: 0

meta:
  name: persona_lora
  version: '1.0'
